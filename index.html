<style>
body{margin:0;background:var(--qm-canvas)}
.preview-bar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--qm-rule);padding:18px 32px;font-family:"Microsoft YaHei",sans-serif}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;max-width:1200px;margin:auto}
.brand{display:flex;align-items:baseline;gap:14px}.brand b{font-size:21px;letter-spacing:2px;color:var(--qm-ink)}.brand span{font-size:12px;color:var(--qm-muted)}
.controls,.palettes{display:flex;align-items:center;flex-wrap:wrap;gap:7px}
.palettes{max-width:1200px;margin:15px auto 0;padding-top:14px;border-top:1px solid var(--qm-rule)}
.palette-label{font-size:12px;color:var(--qm-muted);margin-right:8px}
button{font:inherit;font-size:13px;border:1px solid var(--qm-rule);color:var(--qm-ink);background:white;padding:8px 15px;cursor:pointer;border-radius:4px}
.controls button[aria-pressed=true]{background:var(--qm-accent);color:#fff;border-color:var(--qm-accent)}
.palettes button{display:flex;align-items:center;gap:7px}
.palettes button[aria-pressed=true]{border-color:var(--qm-accent);background:var(--qm-tint);box-shadow:inset 0 0 0 1px var(--qm-accent)}
.swatch{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--swatch)}
button:focus-visible{outline:2px solid var(--qm-accent);outline-offset:3px}
.preview-hint{max-width:880px;margin:24px auto 14px;padding:0 16px;box-sizing:border-box;font:12px/1.7 "Microsoft YaHei",sans-serif;color:var(--qm-muted)}
#write{background:#fff;margin-bottom:36px;border:1px solid var(--qm-rule);box-shadow:0 5px 22px #263c3a07}
.preview-footer{text-align:center;font:12px/1.8 "Microsoft YaHei",sans-serif;color:var(--qm-muted);padding:0 20px 30px}
@media(max-width:760px){.preview-bar{position:static;padding:16px}.toolbar{align-items:flex-start;flex-direction:column;gap:12px}.brand span{font-size:11px}.palettes{gap:6px}.palette-label{width:100%}.palettes button{padding:7px 11px}.preview-hint{margin-top:16px}#write{border-left:0;border-right:0}}
@media print{.preview-bar,.preview-hint,.preview-footer{display:none!important}body{background:#fff}#write{border:0;box-shadow:none;margin:0}}
</style>

<body>
<header class="preview-bar">
  <div class="toolbar"><div class="brand"><b>教师工作纸</b><span>高中化学示例 / TYPORA 主题</span></div>
  <nav class="controls" aria-label="文档类型"><button type="button" data-index="0" aria-pressed="true">备课</button><button type="button" data-index="1" aria-pressed="false">讲义</button><button type="button" data-index="2" aria-pressed="false">作业</button><button type="button" id="print">打印当前示例</button></nav></div>
  <nav class="palettes" aria-label="主题配色"><span class="palette-label">选择配色</span><button type="button" data-palette="0" aria-pressed="false"><span class="swatch" style="--swatch:#355f99" aria-hidden="true"></span>雾蓝</button><button type="button" data-palette="1" aria-pressed="false"><span class="swatch" style="--swatch:#74589a" aria-hidden="true"></span>葡萄紫</button><button type="button" data-palette="2" aria-pressed="false"><span class="swatch" style="--swatch:#876047" aria-hidden="true"></span>暖棕</button><button type="button" data-palette="3" aria-pressed="false"><span class="swatch" style="--swatch:#9b5069" aria-hidden="true"></span>胭脂</button><button type="button" data-palette="4" aria-pressed="false"><span class="swatch" style="--swatch:#505b69" aria-hidden="true"></span>石墨</button></nav>
</header>
<div class="preview-hint" id="hint" aria-live="polite"></div><main id="write"></main>
<footer class="preview-footer">五种配色 × 三种版式 · 离线可用<br>此页用于比较排版；请在 Typora 中打开配套 Markdown 文件编辑。打印统一为黑白样式。</footer>
<script>
const pages=["<div class=\"qm-kicker\">高中化学 · 反应速率 · 教学设计</div>\n\n<h1>影响化学反应速率的因素</h1>\n<div class=\"qm-meta\"><span>课型：数据探究</span><span>课时：40 分钟</span><span>备课人：________</span></div>\n\n<blockquote>\n<p><strong>核心问题</strong>　过氧化氢分解时，怎样通过公平的比较，判断浓度、温度和催化剂对反应快慢的影响？</p>\n</blockquote>\n<h2>一、学习目标</h2>\n<ol>\n<li>根据浓度变化与时间，计算指定时间段内的平均反应速率，并写出单位。</li>\n<li>从对照数据中识别自变量、控制变量与观测指标，作出有依据的判断。</li>\n<li>区分反应快慢与生成物总量，说明证据能够支持的结论范围。</li>\n</ol>\n<h2>二、学情与重难点</h2>\n<p><strong>学习起点</strong>：假定学生已学物质的量浓度和反应速率的定义。常见误区假设：把“产气更多”直接等同于“反应更快”，或把研碎固体解释为增大固体浓度。</p>\n<p><strong>重点</strong>：控制变量，依据同一指标比较速率。<br />\n<strong>难点</strong>：区分气体体积随时间的变化与最终产气量；说明测量条件。</p>\n<h2>三、原理与探究准备</h2>\n<p>过氧化氢在二氧化锰催化下分解：<strong>2H₂O₂ → 2H₂O + O₂↑（催化剂：MnO₂）</strong>。</p>\n<p>本课使用配套作业中的自编数据，探究框架为“提出问题 → 选择对照 → 比较指标 → 限定结论”。不同组收集的气体须在相同温度、压强下比较体积。</p>\n<blockquote>\n<p><strong>备课提示</strong>　这是一份纸面数据探究示例。实做时应另行确认学校的试剂、气体收集装置和预实验方案；过氧化氢避免接触眼睛、皮肤，产气装置不可封闭憋压。</p>\n</blockquote>\n<div class=\"qm-page-break\"></div>\n\n<h2>四、教学过程</h2>\n<table>\n<thead>\n<tr>\n<th>环节与用时</th>\n<th>教师引导与学生活动</th>\n<th>评价证据</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>情境诊断 · 5 分钟</td>\n<td>提问“气体最终更多，能否说明反应更快？”学生说明理由。</td>\n<td>关注时间与比较条件。</td>\n</tr>\n<tr>\n<td>方法建构 · 8 分钟</td>\n<td>回顾 v = Δc / Δt；区分浓度速率与产气体积的比较指标。</td>\n<td>计算正确，单位完整。</td>\n</tr>\n<tr>\n<td>数据探究 · 15 分钟</td>\n<td>分析作业 A、B、C 三组；选择对照，解释测量条件。</td>\n<td>识别单一变量，引用数据。</td>\n</tr>\n<tr>\n<td>迁移设计 · 8 分钟</td>\n<td>设计检验 MnO₂ 催化作用的对照，讨论能否推出总量变化。</td>\n<td>方案可比，结论有边界。</td>\n</tr>\n<tr>\n<td>出口评价 · 4 分钟</td>\n<td>独立计算浓度变化题，纠正“研碎使固体浓度增大”的说法。</td>\n<td>能计算并解释表面积作用。</td>\n</tr>\n</tbody>\n</table>\n<h2>五、关键追问与预期回答</h2>\n<ul>\n<li><strong>为什么比较相同体积气体所需时间？</strong> 同温同压下相同体积对应相同物质的量，用时更短表明该阶段平均产气速率更大。</li>\n<li><strong>升温组的气体能直接按不同温度下的体积比较吗？</strong> 不能；气体体积受温度影响，应统一测量条件。</li>\n<li><strong>催化剂是否使最终 O₂ 更多？</strong> 相同初始量的 H₂O₂ 完全分解、无副反应时，理论 O₂ 总量不因催化剂改变。</li>\n</ul>\n<h2>六、板书、作业与反思</h2>\n<p><strong>条件改变 → 速率变化；单一变量 → 数据证据；反应快慢 ≠ 最终产量。</strong></p>\n<p>课后完成配套学生作业；解析见独立教师参考。反思记录：学生最易遗漏的控制条件是<span class=\"qm-blank\">　　</span>；下一课的补救任务是<span class=\"qm-blank\">　　</span>。</p>\n<div class=\"qm-lines\"><div></div><div></div></div>", "<div class=\"qm-kicker\">高中化学 · 反应速率 · 学习讲义</div>\n\n<h1>从反应条件到数据证据</h1>\n<div class=\"qm-meta\"><span>主题：化学反应速率</span><span>班级：________</span><span>姓名：________</span></div>\n\n<blockquote>\n<p><strong>学习目标</strong>　会计算平均速率，会选择对照组，会区分反应快慢与生成物总量。</p>\n</blockquote>\n<h2>一、平均反应速率怎么表示</h2>\n<p>用反应物 A 表示：<strong>v(A) = [c₀(A) − cₜ(A)] / Δt</strong>，取正值；常用单位为 mol·L⁻¹·s⁻¹。它描述指定时间段的平均快慢。</p>\n<p><strong>例题</strong>：恒容溶液中，20 s 内 H₂O₂ 的浓度由 0.80 mol·L⁻¹ 降到 0.60 mol·L⁻¹，则 v(H₂O₂) = (0.80 − 0.60) / 20 = <strong>0.010 mol·L⁻¹·s⁻¹</strong>。</p>\n<h2>二、哪些条件会影响反应速率</h2>\n<table>\n<thead>\n<tr>\n<th>条件变化</th>\n<th>常见影响与适用说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>增大反应物浓度</td>\n<td>其他条件相同时，通常使反应速率增大。</td>\n</tr>\n<tr>\n<td>升高温度</td>\n<td>其他条件相同时，通常使反应速率增大。</td>\n</tr>\n<tr>\n<td>加入合适的催化剂</td>\n<td>可加快反应；催化剂的质量和化学性质在反应前后不变。</td>\n</tr>\n<tr>\n<td>增大固体接触面积</td>\n<td>对有固体参与的反应，研碎通常有利于加快反应；不是增大固体浓度。</td>\n</tr>\n</tbody>\n</table>\n<h2>三、怎样用产气数据比较</h2>\n<p>研究反应：<strong>2H₂O₂ → 2H₂O + O₂↑（催化剂：MnO₂）</strong>。</p>\n<p>可比较相同时间内收集的 O₂ 体积，或收集相同体积 O₂ 所需的时间。须保证气体的测量温度、压强一致，并控制漏气等干扰。</p>\n<blockquote>\n<p><strong>易错提醒</strong>　ΔV(O₂) / Δt 的单位可为 mL·s⁻¹，它是平均产气体积速率，不能直接写成 mol·L⁻¹·s⁻¹。短时产气较多，也不能直接推断最终产量较大。</p>\n</blockquote>\n<h2>四、当堂自检</h2>\n<p>相同量的 H₂O₂ 在有、无 MnO₂ 两种条件下均完全分解且无副反应。理论 O₂ 总量是否相同？哪些条件影响达到终点所需的时间？</p>\n<div class=\"qm-lines\"><div></div><div></div></div>", "<div class=\"qm-kicker\">高中化学 · 反应速率 · 学生作业 / 第 1 页</div>\n\n<h1>影响化学反应速率的因素</h1>\n<div class=\"qm-meta\"><span>班级：________</span><span>姓名：________</span><span>日期：____月____日</span><span>建议用时：20 分钟</span></div>\n\n<h2>一、基础巩固</h2>\n<p><strong>1. 单选。</strong> 下列说法正确的是（　　）。</p>\n<p>A. 催化剂总能增大反应完全进行后生成物的理论总量。<br />\nB. 其他条件相同时，升高温度通常能加快化学反应。<br />\nC. 将固体研碎能加快反应，是因为固体浓度增大。<br />\nD. 只要最终生成的气体更多，就能说明反应速率更大。</p>\n<p><strong>2. 计算。</strong> 恒容溶液中，H₂O₂ 的浓度在 20 s 内由 0.80 mol·L⁻¹ 降至 0.60 mol·L⁻¹。写出该时间段 v(H₂O₂) 的计算式、结果与单位。</p>\n<div class=\"qm-lines\"><div></div></div>\n\n<h2>二、控制变量与数据分析</h2>\n<p>研究 H₂O₂ 分解：2H₂O₂ → 2H₂O + O₂↑（催化剂：MnO₂）。各组初始溶液体积均为 20.0 mL；MnO₂ 的质量、颗粒大小及装置相同。<strong>下表为自编示例数据</strong>，气体体积均换算至相同温度、压强，忽略漏气和溶解损失。</p>\n<table>\n<thead>\n<tr>\n<th>组别</th>\n<th>初始 c(H₂O₂) / (mol·L⁻¹)</th>\n<th>反应温度 / ℃</th>\n<th>收集 20.0 mL O₂ 用时 / s</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>A</td>\n<td>0.50</td>\n<td>25</td>\n<td>60</td>\n</tr>\n<tr>\n<td>B</td>\n<td>1.00</td>\n<td>25</td>\n<td>30</td>\n</tr>\n<tr>\n<td>C</td>\n<td>0.50</td>\n<td>35</td>\n<td>40</td>\n</tr>\n</tbody>\n</table>\n<p><strong>3.</strong> 研究浓度影响应比较哪两组？这两组从开始至收集 20.0 mL O₂ 的平均产气体积速率之比是多少（按组别字母顺序）？</p>\n<div class=\"qm-lines\"><div></div><div></div></div>\n\n<p><strong>4.</strong> A、C 两组支持什么结论？能否仅据表中时间数据断言 C 组最终生成的 O₂ 更多？说明理由。</p>\n<div class=\"qm-lines\"><div></div><div></div></div>\n\n<div class=\"qm-page-break\"></div>\n\n<div class=\"qm-kicker\">高中化学 · 反应速率 · 学生作业 / 第 2 页</div>\n\n<h2>三、迁移：检验催化剂的作用</h2>\n<p><strong>5.</strong> 若要判断 MnO₂ 是否加快 H₂O₂ 分解，请设计有、无 MnO₂ 的对照方案。本题仅作纸面设计，实际操作另按教师确认的方案开展。</p>\n<table class=\"qm-planning\">\n<thead><tr><th>方案项目</th><th>我的设计</th></tr></thead>\n<tbody>\n<tr><td>自变量与对照设置</td><td></td></tr>\n<tr><td>至少三个控制条件</td><td></td></tr>\n<tr><td>观测指标与比较方法</td><td></td></tr>\n<tr><td>一种干扰及改进方法</td><td></td></tr>\n</tbody>\n</table>\n\n<p>补充说明：两组初始 H₂O₂ 的物质的量相同，最终均完全分解且无副反应。理论 O₂ 总量有何关系？请用化学方程式说明。</p>\n<div class=\"qm-answer\"></div>\n\n<h2>四、订正与自评</h2>\n<p><strong>我能做到</strong>：□ 写全速率单位　□ 选择有效对照　□ 区分快慢与总量</p>\n<p>本次的易错点与订正：</p>\n<div class=\"qm-lines\"><div></div><div></div></div>\n\n<p>教师反馈：</p>\n<div class=\"qm-lines\"><div></div></div>"];
const palettes=[{"name": "雾蓝", "accent": "#355f99", "ink": "#283548", "muted": "#5b687b", "tint": "#edf3fb", "rule": "#ccd9ea", "canvas": "#f4f7fb", "selection": "#d5e2f4", "description": "清晰理性，适合化学备课与知识梳理。"}, {"name": "葡萄紫", "accent": "#74589a", "ink": "#372d46", "muted": "#6c617b", "tint": "#f3eff8", "rule": "#ddd3e8", "canvas": "#f8f6fb", "selection": "#e3d8ef", "description": "柔和沉静，适合长时间阅读与讲义。"}, {"name": "暖棕", "accent": "#876047", "ink": "#44342a", "muted": "#786757", "tint": "#f7f0e8", "rule": "#e3d5c6", "canvas": "#faf7f2", "selection": "#ebddcc", "description": "温暖纸感，适合教案与教学反思。"}, {"name": "胭脂", "accent": "#9b5069", "ink": "#442e36", "muted": "#7a626c", "tint": "#fbf0f3", "rule": "#ebd3dc", "canvas": "#fcf7f8", "selection": "#f1d6e0", "description": "重点鲜明，适合例题、讲评与复习材料。"}, {"name": "石墨", "accent": "#505b69", "ink": "#303842", "muted": "#64707e", "tint": "#f0f3f6", "rule": "#d5dce4", "canvas": "#f6f7f9", "selection": "#dce3eb", "description": "简洁克制，适合作业、试题和正式文档。"}];
const modes=['备课','讲义','作业'];
let currentMode=0,currentPalette=0;
function select(mode=currentMode,palette=currentPalette){
  currentMode=mode;currentPalette=palette;
  document.getElementById('theme').href='themes/'+palettes[palette].name+modes[mode]+'.css';
  document.getElementById('write').innerHTML=pages[mode];
  document.getElementById('hint').textContent=palettes[palette].name+' · '+modes[mode]+'版 — '+palettes[palette].description;
  document.querySelectorAll('[data-index]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.index)===mode)));
  document.querySelectorAll('[data-palette]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.palette)===palette)));
}
document.querySelectorAll('[data-index]').forEach(b=>b.addEventListener('click',()=>select(Number(b.dataset.index))));
document.querySelectorAll('[data-palette]').forEach(b=>b.addEventListener('click',()=>select(currentMode,Number(b.dataset.palette))));
document.getElementById('print').addEventListener('click',()=>window.print());select();
</script>
</body></html>
